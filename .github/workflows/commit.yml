name: Build Modification

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Spotless Check
      run: ./gradlew spotlessCheck

    - name: Build
      run: ./gradlew build

    - name: Unit Tests
      run: ./gradlew test
