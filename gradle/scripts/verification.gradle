import java.security.MessageDigest

tasks.register('verifyBundledDependencies') {
    group = 'verification'
    description = 'Checks the pinned GregTech binaries and their accompanying sources.'
    def expected = [
        'libs/gregtech-1.12.2-2.9.0-voidstudio-dev.jar':
            '85cc52624f83854f218698130e6a62750686560e512aa469f0f1568970dd5a02',
        'libs/gregtech-1.12.2-2.9.0-voidstudio-sources.jar':
            'bd49373bbd4fbeb001d5ea64e1bf42d0f51ee6aaabe9d1a858159266dd97ab97'
    ]
    def bundled = fileTree(dir: 'libs', include: ['*.jar'])
    def baseDirectory = project.projectDir
    inputs.property('expectedChecksums', expected)
    inputs.files(bundled)
    doLast {
        def artifacts = bundled.files.collectEntries { artifact ->
            def path = baseDirectory.toPath().relativize(artifact.toPath()).toString().replace(File.separator, '/')
            [(path): artifact]
        }
        if (artifacts.keySet() != expected.keySet()) {
            throw new GradleException('Bundled dependency list changed; review libs and update gradle/scripts/verification.gradle')
        }
        artifacts.each { path, artifact ->
            def checksum = MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
            if (checksum != expected[path]) {
                throw new GradleException("Bundled dependency checksum mismatch: ${artifact.name}")
            }
        }
    }
}
tasks.named('compileJava').configure { dependsOn 'verifyBundledDependencies' }
